# The road: 12 etapas in the order of the DGT's simplified manual (design proposal v0.4).
# Tramo codes are etapa-1NN and are never renumbered. Only tramos that have
# items are put in the pack; the rest is the plan.
etapas:
  - code: SE
    name: Villaseñal
    topic: Señales
    landscape: ciudad
    free: true
    tramos:
      - {code: SE-101, title: Prioridad entre señales y agentes, truco: T-SE-101}
      - {code: SE-102, title: Semáforos}
      - {code: SE-103, title: Señales de peligro}
      - {code: SE-104, title: Señales de prohibición y obligación}
      - {code: SE-105, title: Marcas viales}
