name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest -Prelanti.android=false

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :androidApp:assembleDebug
      - name: Playthrough tests (Robolectric, with screenshots)
        run: ./gradlew :androidApp:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: relanti-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots-playthrough
          path: androidApp/build/screenshots/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: androidApp/build/reports/tests/

  ios:
    name: iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen
      - name: Build for the simulator
        run: |
          cd iosApp
          xcodebuild -project Relanti.xcodeproj -scheme Relanti -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 80
          exit ${PIPESTATUS[0]}
      - name: Pick simulators
        run: |
          xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          phones=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          main=next((x for x in phones if 'Pro' in x['name'] and 'Max' not in x['name']), phones[0])
          se=next((x for x in phones if 'SE' in x['name']), None) or next((x for x in phones if x['name'].endswith(('16e','17e'))), main)
          print('SIM='+main['udid']); print('SIM_SE='+se['udid'])
          print('main', main['name'], 'small', se['name'], file=sys.stderr)
          " >> "$GITHUB_ENV"
      - name: Playthrough UI tests (XCUITest, launches the app on a simulator)
        run: |
          cd iosApp
          xcodebuild -project Relanti.xcodeproj -scheme Relanti -configuration Debug \
            -destination "id=$SIM" -derivedDataPath build -resultBundlePath ../results/main.xcresult \
            CODE_SIGNING_ALLOWED=NO test | tail -n 120
          exit ${PIPESTATUS[0]}
      - name: Small phone playthrough
        run: |
          cd iosApp
          xcodebuild -project Relanti.xcodeproj -scheme Relanti -configuration Debug \
            -destination "id=$SIM_SE" -derivedDataPath build -resultBundlePath ../results/small.xcresult \
            -only-testing:RelantiUITests/PlaythroughUITests/testSecondGoodDayEarnsTheTollTicket \
            CODE_SIGNING_ALLOWED=NO test | tail -n 60
          exit ${PIPESTATUS[0]}
      - name: Export screenshots
        if: always()
        run: |
          for r in main small; do
            [ -d "results/$r.xcresult" ] || continue
            mkdir -p "screenshots/$r"
            xcrun xcresulttool export attachments --path "results/$r.xcresult" --output-path "screenshots/$r" || true
          done
          ls -R screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: screenshots/

  android-emulator:
    name: Android emulator smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :androidApp:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on an emulator and check it stays up
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: screenshots/
